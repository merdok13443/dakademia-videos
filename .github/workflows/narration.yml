name: Narration (Gemini voice)

# Stage 4 of the Dakademia pipeline in the cloud: runs `pipeline/voice.py` on work/<video>/ (script.json already on `dev`).
# ONE Gemini request for the whole script, then Whisper word alignment, pause injection and the voice rules check;
# the results (voice.wav, timing.json, voice_stamp.json ...) are committed back to `dev` under work/<video>/voice/.
# Secret: GEMINI_API_KEY. The key is used ONLY by tts_he.py, ONLY for narration, ONLY with the three allowed models
# (voice.py refuses anything else). A re-run for the same script.json spends no new request (voice_stamp.json).
# Launch: GitHub mobile app (Actions > Narration > Run workflow), or a Claude thread via the Actions API (ref dev).

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Work folder name under work/, e.g. u01-e07'
        required: true
        type: string
      dry_run:
        description: 'Check only: script pre-check, packages and key present; NO Gemini request'
        required: true
        type: boolean
        default: false
      retake:
        description: 'Force a NEW take (spends another request; budget is 3 per video)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: narration
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check inputs
        env:
          VIDEO: ${{ inputs.video }}
        run: |
          echo "$VIDEO" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "bad video name"; exit 1; }

      - name: Check out videos repo (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: videos

      - name: Check out skills repo (dev)
        uses: actions/checkout@v4
        with:
          repository: merdok13443/skills
          ref: dev
          path: skills

      - name: Check the script is there
        env:
          VIDEO: ${{ inputs.video }}
        run: test -f "videos/work/$VIDEO/voice/script.json" || { echo "work/$VIDEO/voice/script.json is not on dev"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install google-genai numpy soundfile scipy faster-whisper

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-ivrit-large-v3-turbo-ct2

      - name: Voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO: ${{ inputs.video }}
          RETAKE: ${{ inputs.retake }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("videos/work/$VIDEO" --skills skills)
          if [ "$RETAKE" = "true" ]; then args+=(--retake); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--check); python -c "import faster_whisper, google.genai, soundfile, scipy, numpy; print('packages OK')"; fi
          python -u skills/daki-dakademia/pipeline/voice.py "${args[@]}"

      - name: Commit the voice files to dev
        if: ${{ always() && !inputs.dry_run }}
        working-directory: videos
        env:
          VIDEO: ${{ inputs.video }}
        run: |
          git config user.name "dakademia-voice"
          git config user.email "dakademia-voice@users.noreply.github.com"
          git add "work/$VIDEO/voice"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Narration for $VIDEO (voice.py in the cloud)"
          for i in 1 2 3 4; do
            git push origin HEAD:dev && exit 0
            git pull --rebase origin dev
          done
          exit 1
