name: Upload to YouTube

# One tap from the GitHub mobile app (Actions > Upload to YouTube > Run workflow), or triggered by a Claude thread
# after the owner approves in chat. Publishes ONE delivered video from `dev` to YouTube (public, not made for kids,
# category Education, Hebrew), Instagram (Reel) and/or TikTok (a DRAFT in the owner's TikTok inbox: the owner taps the
# notification in the TikTok app and presses Publish), then records the result in publish-state.json on `dev`.
# Secrets: YT_TOKEN_JSON (YouTube), IG_ACCESS_TOKEN (Instagram), TIKTOK_CLIENT_KEY + TIKTOK_CLIENT_SECRET (TikTok,
# plus tiktok-token.enc made once by the workflow `TikTok login`).
# Release rule (owner 2026-11-26): a script score of 95+ in the video's json releases it without the owner; otherwise tick owner_approved.
# At most one upload per hour, 10:00-21:00 Israel time (publish_cloud.py refuses otherwise).
# Rules and secret setup: merdok13443/skills, daki-dakademia/PUBLISHING-DAKI.md, section "Cloud upload".

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Video name: course-slug/uNN-eNN, e.g. discrete-math/u01-e03'
        required: true
        type: string
      privacy:
        description: 'public for a real upload; private or unlisted only for a test'
        required: true
        type: choice
        default: public
        options: [public, unlisted, private]
      platforms:
        description: 'Where to publish'
        required: true
        type: choice
        default: youtube
        options: [youtube, instagram, tiktok, 'youtube,instagram', 'youtube,tiktok', 'instagram,tiktok', 'youtube,instagram,tiktok']
      allow_out_of_order:
        description: 'Skip the curriculum-order guard (ONLY on the owner explicit word)'
        required: false
        type: boolean
        default: false
      owner_approved:
        description: 'The owner approved this video in chat (needed when its script score is missing or below 95)'
        required: false
        type: boolean
        default: false
      allow_outside_hours:
        description: 'Skip the active-hours (10:00-21:00 Israel) and one-per-hour guard (ONLY on the owner explicit word)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: check login, files and texts, upload nothing'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check inputs
        env:
          VIDEO: ${{ inputs.video }}
        run: |
          echo "$VIDEO" | grep -Eq '^[a-z0-9-]+/u[0-9]{2}-e[0-9]{2}(-v[0-9]+)?$' || { echo "bad video name"; exit 1; }

      - name: Check out videos repo (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: videos

      - name: Check out skills repo (dev)
        uses: actions/checkout@v4
        with:
          repository: merdok13443/skills
          ref: dev
          path: skills

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YouTube client
        run: pip install google-api-python-client google-auth google-auth-oauthlib cryptography

      - name: Upload
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: '17841460444687086'
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          VIDEO: ${{ inputs.video }}
          PRIVACY: ${{ inputs.privacy }}
          PLATFORMS: ${{ inputs.platforms }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_OOO: ${{ inputs.allow_out_of_order }}
          OWNER_OK: ${{ inputs.owner_approved }}
          ALLOW_HOURS: ${{ inputs.allow_outside_hours }}
        run: |
          sha=$(git -C videos rev-parse HEAD)
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}/${VIDEO}.mp4"
          args=(--videos-dir videos --name "$VIDEO" --privacy "$PRIVACY" --platforms "$PLATFORMS" --video-url "$url")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$ALLOW_OOO" = "true" ]; then args+=(--allow-out-of-order); fi
          if [ "$OWNER_OK" = "true" ]; then args+=(--owner-approved); fi
          if [ "$ALLOW_HOURS" = "true" ]; then args+=(--allow-outside-hours); fi
          python -u skills/daki-dakademia/pipeline/publish_cloud.py "${args[@]}"

      - name: Commit the publish record to dev
        if: ${{ always() }}
        working-directory: videos
        env:
          VIDEO: ${{ inputs.video }}
        run: |
          git config user.name "dakademia-uploader"
          git config user.email "dakademia-uploader@users.noreply.github.com"
          # a dry run changes nothing except a rotated TikTok refresh token, which must never be lost
          git add publish-state.json PUBLISH-STATE.md "$VIDEO.json"
          if [ -f tiktok-token.enc ]; then git add tiktok-token.enc; fi
          if git diff --cached --quiet; then echo "nothing to record"; exit 0; fi
          git commit -m "Record publish of $VIDEO"
          cp publish-state.json /tmp/mine-state.json
          cp "$VIDEO.json" /tmp/mine-meta.json
          if [ -f tiktok-token.enc ]; then cp tiktok-token.enc /tmp/mine-tt.enc; fi
          for i in 1 2 3 4; do
            git push origin HEAD:dev && exit 0
            # dev moved (another PR merged meanwhile). Never rebase the generated PUBLISH-STATE.md (conflicts):
            # start again from the new dev, put this video's record back and regenerate the table.
            git fetch -q origin dev
            git reset -q --hard origin/dev
            python3 - "$VIDEO" <<'PY'
          import json, sys
          sys.path.insert(0, '../skills/shorts-uploader/scripts')
          import publish_state as P
          vid = sys.argv[1]
          mine = json.load(open('/tmp/mine-state.json', encoding='utf-8'))
          cur = P.load('publish-state.json')
          cur.setdefault('videos', {})[vid] = mine['videos'][vid]
          P.save('publish-state.json', cur)
          PY
            cp /tmp/mine-meta.json "$VIDEO.json"
            if [ -f /tmp/mine-tt.enc ]; then cp /tmp/mine-tt.enc tiktok-token.enc; fi
            git add publish-state.json PUBLISH-STATE.md "$VIDEO.json"
            if [ -f tiktok-token.enc ]; then git add tiktok-token.enc; fi
            git commit -q -m "Record publish of $VIDEO"
          done
          exit 1
